name: Publish 40L U-Groove Video

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-ugroove-video.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact PlantLogic MASTER
        run: |
          set -euo pipefail
          mkdir -p .master
          curl --fail --location --retry 2 --output ".master/plantlogic-40l-ugroove-master.mp4" "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-5358-8210-a2d6-3d1f414fe5f0/raw?se=2026-09-29T06%3A45%3A41Z&sp=r&sv=2026-02-06&sr=b&scid=e5949da9-38b2-5291-954a-cc385b2595ff&skoid=40ce4b34-a373-4a62-b0bf-44befe221915&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T04%3A51%3A54Z&ske=2026-09-30T04%3A51%3A54Z&sks=b&skv=2026-02-06&sig=UuR7TuWE2Y1MoSsbx7RKaT2QnL10mhM%2BhsQPvEtD1e8%3D"
          test -s ".master/plantlogic-40l-ugroove-master.mp4"
          test "$(stat -c%s .master/plantlogic-40l-ugroove-master.mp4)" -eq 22499420

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg >/dev/null

      - name: Encode approved cut
        run: |
          set -euo pipefail
          SRC=".master/plantlogic-40l-ugroove-master.mp4"
          mkdir -p media/video
          ffmpeg -y -loglevel error -i "$SRC" -ss 5.000 -t 7.970 -an -vf "scale=1280:-2:flags=lanczos,fps=30" -c:v libx264 -preset slow -crf 20 -pix_fmt yuv420p -movflags +faststart media/video/ugroove-irrigation.mp4
          ffmpeg -y -loglevel error -i "$SRC" -ss 5.000 -t 7.970 -an -vf "scale=1280:-2:flags=lanczos,fps=30" -c:v libvpx-vp9 -crf 30 -b:v 0 -deadline good -cpu-used 2 -row-mt 1 media/video/ugroove-irrigation.webm
          ffmpeg -y -loglevel error -i "$SRC" -ss 8.000 -frames:v 1 -vf "scale=1280:-2:flags=lanczos" -c:v libwebp -q:v 82 -compression_level 6 media/video/ugroove-irrigation-poster.webp

      - name: Update Garden integration and source registry
        run: python3 .github/scripts/publish_ugroove.py

      - name: Verify scoped changes
        run: |
          set -euo pipefail
          git diff --name-only | sort
          bad=$(git diff --name-only | grep -E '^media/video/' | grep -v -E '^media/video/ugroove-irrigation\.(mp4|webm)$|^media/video/ugroove-irrigation-poster\.webp$' || true)
          test -z "$bad"

      - name: Commit and publish
        run: |
          rm -rf .master
          rm -f .github/scripts/publish_ugroove.py
          rm -f .github/workflows/publish-ugroove-video.yml
          rm -f .github/workflows/refine-plantlogic-video-cuts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish 40L U-Groove video block"
          git push
