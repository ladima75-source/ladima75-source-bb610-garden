name: Remove outdated BB610 Garden logo tagline
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-bb610-garden-logo.yml
permissions:
  contents: write
jobs:
  clean-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow
      - name: Edit original artwork, preserve BB610 Garden
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p = Path('media/bb610-garden-user-logo.webp')
          im = Image.open(p).convert('RGBA')
          w, h = im.size
          # Clear only the separate old "Плантации под ключ" tagline below the main mark.
          # Keep every original pixel above the cutoff.
          cutoff = round(h * 0.81)
          im.putalpha(Image.frombytes('L', im.size, bytes(
              0 if y >= cutoff else im.getchannel('A').getpixel((x,y))
              for y in range(h) for x in range(w)
          )))
          im.save(p, 'WEBP', lossless=True, method=6)
          # For Threads: original preserved graphic, no redraw; transparent square canvas.
          bbox = im.getbbox()
          symbol = im.crop(bbox)
          max_w, max_h = 900, 650
          scale = min(max_w / symbol.width, max_h / symbol.height)
          resized = symbol.resize((round(symbol.width*scale), round(symbol.height*scale)), Image.Resampling.LANCZOS)
          square = Image.new('RGBA', (1080, 1080), (0,0,0,0))
          square.alpha_composite(resized, ((1080-resized.width)//2,(1080-resized.height)//2))
          square.save('media/bb610-garden-threads-avatar.png', 'PNG', optimize=True)
          print('Original canvas:',(w,h),'cutoff:',cutoff,'trim bbox:',bbox,'avatar size:',square.size)
          PY
      - name: Commit corrected logo and Threads avatar
        run: |
          git config user.name "BB610 Garden Assets"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/bb610-garden-user-logo.webp media/bb610-garden-threads-avatar.png
          git diff --cached --quiet || (git commit -m "Garden logo: remove outdated turnkey plantations tagline" && git push)
