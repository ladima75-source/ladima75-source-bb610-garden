name: Publish Garden Video Pack V1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-garden-video-pack-v1.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg >/dev/null

      - name: Download approved BB610 Garden Video Pack V1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .pack media/video
          curl --fail --location --retry 2 -o .pack/01_corporate_quality_ua.mp4 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-9704-8210-ba94-734eb6e0f416/raw?se=2026-09-29T07%3A31%3A23Z&sp=r&sv=2026-02-06&sr=b&scid=f033546b-1a5a-58b3-ade8-511db2efcfe0&skoid=40ce4b34-a373-4a62-b0bf-44befe221915&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T05%3A26%3A12Z&ske=2026-09-30T05%3A26%3A12Z&sks=b&skv=2026-02-06&sig=lW7jNAHnLbg4omazIZw3mtiDMXXFdTQY5NKvtJtRc7c%3D'
          curl --fail --location --retry 2 -o .pack/02_zephyr_v2_install_ua.mp4 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-a6ac-8246-8971-defdc2cff9bf/raw?se=2026-09-29T07%3A31%3A26Z&sp=r&sv=2026-02-06&sr=b&scid=dd1312f2-c3c3-5ac2-ba6d-969d67081559&skoid=40ce4b34-a373-4a62-b0bf-44befe221915&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T07%3A18%3A56Z&ske=2026-09-30T07%3A18%3A56Z&sks=b&skv=2026-02-06&sig=fU5QA623olzM68zlFFGj/p7pIdprYFkY6XalAx8sixw%3D'
          curl --fail --location --retry 2 -o .pack/03_40l_ugroove_ua_trimmed.mp4 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-1e6c-8210-98b7-6d529f67a73e/raw?se=2026-09-29T07%3A31%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=0cf8fffd-5726-5810-8d8c-74bc5b184a38&skoid=40ce4b34-a373-4a62-b0bf-44befe221915&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T06%3A13%3A12Z&ske=2026-09-30T06%3A13%3A12Z&sks=b&skv=2026-02-06&sig=w8LZ603nD468YeFU8gUhy2HC8JRxFZ7cEqQRCk02wMY%3D'
          curl --fail --location --retry 2 -o .pack/04_higrow_strawberry_ua.mp4 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-a544-81f4-9403-fae7d568cb24/raw?se=2026-09-29T07%3A31%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=310be76c-0df6-5258-a6cf-23d4d094e052&skoid=40ce4b34-a373-4a62-b0bf-44befe221915&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T06%3A58%3A06Z&ske=2026-09-30T06%3A58%3A06Z&sks=b&skv=2026-02-06&sig=8KpTKsycKP%2BwSRJq8tZu4QfayrpQa%2BFDxBafFzP88bQ%3D'
          curl --fail --location --retry 2 -o .pack/01_corporate_quality_ua-poster.jpg 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-543c-820a-a95f-bdf45eaa67c3/raw?se=2026-09-29T07%3A31%3A34Z&sp=r&sv=2026-02-06&sr=b&scid=60a2edff-8436-53fe-b7ad-8868e82bc690&skoid=40ce4b34-a373-4a62-b0bf-44befe221915&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T07%3A18%3A59Z&ske=2026-09-30T07%3A18%3A59Z&sks=b&skv=2026-02-06&sig=Bc1vI7uxcXR92pIFB80vqVdXbHOiT/qCTAK2GfIoCs0%3D'
          curl --fail --location --retry 2 -o .pack/02_zephyr_v2_install_ua-poster.jpg 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-2f6c-820a-8571-37e81de6627b/raw?se=2026-09-29T07%3A31%3A37Z&sp=r&sv=2026-02-06&sr=b&scid=fa4973d7-c17b-5c0a-8af5-abf271359c1f&skoid=40ce4b34-a373-4a62-b0bf-44befe221915&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T07%3A19%3A03Z&ske=2026-09-30T07%3A19%3A03Z&sks=b&skv=2026-02-06&sig=U/QLiHDy%2BBqim7fIPEq7Irk7XRN%2BCw5D9AnbQzljK5I%3D'
          curl --fail --location --retry 2 -o .pack/03_40l_ugroove_ua-poster.jpg 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-ae48-81f4-9f94-f3babe92c8d4/raw?se=2026-09-29T07%3A31%3A40Z&sp=r&sv=2026-02-06&sr=b&scid=7653c8a1-1b81-566d-bf06-9b01a2aa047f&skoid=40ce4b34-a373-4a62-b0bf-44befe221915&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T05%3A26%3A09Z&ske=2026-09-30T05%3A26%3A09Z&sks=b&skv=2026-02-06&sig=YgxSCEEGeDSS3R4NsyEsYjwY9wU59FnAPvALSxpqPCI%3D'
          curl --fail --location --retry 2 -o .pack/04_higrow_strawberry_ua-poster.jpg 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-b610-8210-9302-e7a7cc8b51e8/raw?se=2026-09-29T07%3A31%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=988c24ae-b9dd-5adf-9872-fb2fd44cb2b8&skoid=40ce4b34-a373-4a62-b0bf-44befe221915&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T06%3A36%3A04Z&ske=2026-09-30T06%3A36%3A04Z&sks=b&skv=2026-02-06&sig=IdmIiHsT%2BQZlIhmg4uHHJr39ySppKZUyoXTjH/CZCBs%3D'
          test "$(stat -c%s .pack/01_corporate_quality_ua.mp4)" -eq 6626963
          test "$(stat -c%s .pack/02_zephyr_v2_install_ua.mp4)" -eq 5059402
          test "$(stat -c%s .pack/03_40l_ugroove_ua_trimmed.mp4)" -eq 2874413
          test "$(stat -c%s .pack/04_higrow_strawberry_ua.mp4)" -eq 6711407

      - name: Publish exact MP4 masters and create WebM/WebP
        shell: bash
        run: |
          set -euo pipefail
          cp .pack/01_corporate_quality_ua.mp4 media/video/corporate-quality.mp4
          cp .pack/02_zephyr_v2_install_ua.mp4 media/video/zephyr-v2-install.mp4
          cp .pack/03_40l_ugroove_ua_trimmed.mp4 media/video/ugroove-irrigation.mp4
          cp .pack/04_higrow_strawberry_ua.mp4 media/video/higrow-strawberry.mp4

          for spec in             'corporate-quality:01_corporate_quality_ua'             'zephyr-v2-install:02_zephyr_v2_install_ua'             'ugroove-irrigation:03_40l_ugroove_ua'             'higrow-strawberry:04_higrow_strawberry_ua'
          do
            key="${spec%%:*}"
            stem="${spec#*:}"
            ffmpeg -y -loglevel error -i "media/video/${key}.mp4" -an -c:v libvpx-vp9 -crf 29 -b:v 0 -deadline good -cpu-used 2 -row-mt 1 "media/video/${key}.webm"
            ffmpeg -y -loglevel error -i ".pack/${stem}-poster.jpg" -frames:v 1 -c:v libwebp -q:v 88 -compression_level 6 "media/video/${key}-poster.webp"
          done

      - name: Integrate four approved stories
        run: python3 .github/scripts/publish_garden_video_pack_v1.py

      - name: Verify package and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -c%s media/video/corporate-quality.mp4)" -eq 6626963
          test "$(stat -c%s media/video/zephyr-v2-install.mp4)" -eq 5059402
          test "$(stat -c%s media/video/ugroove-irrigation.mp4)" -eq 2874413
          test "$(stat -c%s media/video/higrow-strawberry.mp4)" -eq 6711407
          for key in corporate-quality zephyr-v2-install ugroove-irrigation higrow-strawberry; do
            test -s "media/video/${key}.webm"
            test -s "media/video/${key}-poster.webp"
          done
          grep -q '"source": "BB610 Garden Video Pack V1"' media/sources.json
          grep -q '03_40l_ugroove_ua_trimmed.mp4' media/sources.json
          grep -q 'higrow-strawberry' assets/video-storytelling.js
          grep -q 'corporate-quality' assets/video-storytelling.js

      - name: Commit and publish
        run: |
          rm -rf .pack
          rm -f .github/scripts/publish_garden_video_pack_v1.py
          rm -f .github/workflows/publish-garden-video-pack-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Garden Video Pack V1"
          git push
